name: Container Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - '.github/workflows/container.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/charge-spot-quest
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=0.1.0,enable={{is_default_branch}}
            type=raw,value=0.1.1,enable={{is_default_branch}}
            type=raw,value=0.1.2,enable={{is_default_branch}}
            type=raw,value=0.1.3,enable={{is_default_branch}}
            type=raw,value=0.1.4,enable={{is_default_branch}}
            type=raw,value=0.1.5,enable={{is_default_branch}}
            type=raw,value=0.1.6,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
