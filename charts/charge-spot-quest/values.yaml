# =============================================================================
# charge-spot-quest Helm values
# 邻里互助 · 共享充电 — UI + API + DB for k3s / Kubernetes
# =============================================================================
# Database modes (pick ONE):
#   A) SQLite          — sqlite.enabled: true,  postgresql.enabled: false
#   B) Bundled Postgres — postgresql.enabled: true (default)
#   C) External Postgres — postgresql.enabled: false + externalDatabase.*
# Demo / 单节点可用 SQLite；多副本/生产请用外置 PG。
# =============================================================================

replicaCount: 1

image:
  # Placeholder until a real API image exists. Override at install time.
  # 占位镜像；发布真实 API 后用 --set image.repository/tag 覆盖。
  repository: ghcr.io/aaronyang0628/charge-spot-quest
  tag: "0.1.8"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8080

# Non-sensitive app config → ConfigMap. Keep passwords in Secret.
# 非敏感配置进 ConfigMap；密码走 Secret。
env:
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8080"
  LOG_LEVEL: INFO

# Optional runtime env (DingTalk). Do NOT put real webhook/SEC tokens in git.
# Needs BOTH DINGTALK_WEBHOOK_URL and DINGTALK_SEC_SECRET (加签). Prefer Secret + valueFrom.
# extraEnv:
#   - name: DINGTALK_WEBHOOK_URL
#     valueFrom:
#       secretKeyRef:
#         name: charge-spot-dingtalk
#         key: webhook_url
#   - name: DINGTALK_SEC_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: charge-spot-dingtalk
#         key: sec_secret
# Example Secret (create on cluster only — placeholders only in git):
#   kubectl -n charge-spot create secret generic charge-spot-dingtalk \
#     --from-literal=webhook_url='https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN' \
#     --from-literal=sec_secret='SECxxxxxxxxxxxx'
extraEnv: []
extraEnvFrom: []


# -----------------------------------------------------------------------------
# SQLite mode / 纯 SQLite（不要内置也不要外置 PG）
# -----------------------------------------------------------------------------
# helm ... --set sqlite.enabled=true --set postgresql.enabled=false
# API uses DATABASE_URL=sqlite:////app/data/chargespot.sqlite
# Optional PVC keeps bookings across pod restarts (single-replica only).
sqlite:
  enabled: false
  # Path inside the container (must stay under /app/data for the image user)
  path: /app/data/chargespot.sqlite
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# -----------------------------------------------------------------------------
# Postgres mode / 数据库模式
# -----------------------------------------------------------------------------
# 内置 PG (bundled): postgresql.enabled: true  (and sqlite.enabled: false)
# 外置 PG (external): postgresql.enabled: false + externalDatabase.*
# SQLite:             sqlite.enabled: true + postgresql.enabled: false
#
# Production / multi-replica: external PG. Demo: SQLite is fine.
# -----------------------------------------------------------------------------

postgresql:
  # true = deploy simple in-cluster Postgres (MVP / demo only)
  # false = use externalDatabase below
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    # Used only when bundled and no existingSecret
    username: chargespot
    password: ""           # empty → chart generates a random password into Secret
    database: chargespot
    existingSecret: ""     # optional: Secret with keys username, password, database
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""       # empty = cluster default
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 5432

# Used when postgresql.enabled: false AND sqlite.enabled: false
# 外置 Postgres：关内置、且未开 sqlite 时生效
externalDatabase:
  host: pg.example.com
  port: 5432
  user: chargespot
  password: ""             # prefer existingSecret in production
  database: chargespot
  # Optional: Secret with keys host, port, username, password, database
  # 若设置，优先从此 Secret 读取连接信息（含 password）
  existingSecret: ""
  # Optional SSL mode appended to DATABASE_URL (e.g. require)
  sslMode: ""

# Chart-managed app Secret (DATABASE_URL). Usually leave create=true so the
# chart builds DATABASE_URL from postgresql / externalDatabase.
# 一般保持 create=true，由 chart 根据内置/外置 PG 组装 DATABASE_URL。
secrets:
  create: true
  existingSecret: ""       # if set and create=false, Deployment mounts this Secret
  # Extra stringData merged into chart-managed Secret (local/non-prod only)
  stringData: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: charge-spot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS:
  # tls:
  #   - secretName: charge-spot.example.com-tls
  #     hosts:
  #       - charge-spot.example.com

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# API exposes /health and /readyz — probes on by default.
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
