{{- if .Values.secrets.create }}
{{- /* Resolve connection pieces once so Postgres + DATABASE_URL stay in sync. */ -}}
{{- $dbHost := include "charge-spot-quest.dbHost" . -}}
{{- $dbPort := include "charge-spot-quest.dbPort" . | toString -}}
{{- $dbUser := include "charge-spot-quest.dbUser" . -}}
{{- $dbName := include "charge-spot-quest.dbName" . -}}
{{- $ssl := "" -}}
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.sslMode -}}
{{- $ssl = printf "?sslmode=%s" .Values.externalDatabase.sslMode -}}
{{- end -}}
{{- $password := "" -}}
{{- $skipUrl := false -}}
{{- if .Values.postgresql.enabled -}}
  {{- if .Values.postgresql.auth.password -}}
    {{- $password = .Values.postgresql.auth.password -}}
  {{- else if .Values.postgresql.auth.existingSecret -}}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.postgresql.auth.existingSecret -}}
    {{- if and $existing $existing.data (index $existing.data "password") -}}
      {{- $password = index $existing.data "password" | b64dec -}}
    {{- else -}}
      {{- fail (printf "postgresql.auth.existingSecret %q not found or missing key password" .Values.postgresql.auth.existingSecret) -}}
    {{- end -}}
  {{- else -}}
    {{- /* Stable password across upgrades: reuse chart Secret if present. */ -}}
    {{- $secretName := include "charge-spot-quest.secretName" . -}}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
    {{- if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") -}}
      {{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
    {{- else -}}
      {{- $password = randAlphaNum 24 -}}
    {{- end -}}
  {{- end -}}
{{- else if .Values.externalDatabase.existingSecret -}}
  {{- /* External Secret owns credentials; only emit URL if password also provided in values. */ -}}
  {{- if .Values.externalDatabase.password -}}
    {{- $password = .Values.externalDatabase.password -}}
  {{- else -}}
    {{- $skipUrl = true -}}
  {{- end -}}
{{- else -}}
  {{- if not .Values.externalDatabase.password -}}
    {{- fail "Set externalDatabase.password or externalDatabase.existingSecret when postgresql.enabled is false" -}}
  {{- end -}}
  {{- $password = .Values.externalDatabase.password -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "charge-spot-quest.secretName" . }}
  labels:
    {{- include "charge-spot-quest.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not $skipUrl }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s%s" $dbUser $password $dbHost $dbPort $dbName $ssl | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_USER: {{ $dbUser | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ $dbName | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ printf "%v" $value | quote }}
  {{- end }}
{{- end }}
