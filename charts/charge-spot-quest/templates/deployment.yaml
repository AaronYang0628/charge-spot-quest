{{- if and (not .Values.secrets.create) (empty .Values.secrets.existingSecret) }}
{{- fail "secrets.existingSecret is required when secrets.create is false" }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.secrets.create) (empty .Values.postgresql.auth.existingSecret) }}
{{- fail "Bundled Postgres needs secrets.create=true (chart Secret with POSTGRES_*) or postgresql.auth.existingSecret" }}
{{- end }}
{{- if and .Values.sqlite.enabled .Values.postgresql.enabled }}
{{- fail "Enable only one of sqlite.enabled or postgresql.enabled" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.sqlite.enabled) (empty .Values.externalDatabase.host) (empty .Values.externalDatabase.existingSecret) }}
{{- fail "When postgresql.enabled is false: set sqlite.enabled=true, or externalDatabase.host / existingSecret" }}
{{- end }}
{{- if .Values.dingtalk.enabled }}
{{- if empty .Values.dingtalk.existingSecret }}
{{- fail "dingtalk.existingSecret is required when dingtalk.enabled is true (Secret keys: webhook_url, sec_secret, revoke_secret)" }}
{{- end }}
{{- if empty .Values.dingtalk.publicBaseUrl }}
{{- fail "dingtalk.publicBaseUrl is required when dingtalk.enabled is true (Ingress origin, no trailing slash — used for cut-in revoke links)" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "charge-spot-quest.fullname" . }}
  labels:
    {{- include "charge-spot-quest.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "charge-spot-quest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "charge-spot-quest.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ if .Values.automountServiceAccountToken }}true{{ else }}false{{ end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "charge-spot-quest.name" . }}
          image: {{ include "charge-spot-quest.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "charge-spot-quest.fullname" . }}
            {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ include "charge-spot-quest.secretName" . }}
            {{- end }}
            {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.existingSecret }}
            - secretRef:
                name: {{ .Values.externalDatabase.existingSecret | quote }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.dingtalk.enabled .Values.extraEnv }}
          env:
            {{- if .Values.dingtalk.enabled }}
            - name: DINGTALK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dingtalk.existingSecret | quote }}
                  key: webhook_url
            - name: DINGTALK_SEC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dingtalk.existingSecret | quote }}
                  key: sec_secret
            - name: CUT_IN_REVOKE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dingtalk.existingSecret | quote }}
                  key: revoke_secret
            - name: PUBLIC_BASE_URL
              value: {{ .Values.dingtalk.publicBaseUrl | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.sqlite.enabled }}
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.sqlite.enabled }}
      volumes:
        - name: sqlite-data
          {{- if .Values.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "charge-spot-quest.fullname" . }}-sqlite
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
